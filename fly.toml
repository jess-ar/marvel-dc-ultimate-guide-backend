app = "marvel-dc-ultimate-guide-backend"

primary_region = "mad"

[env]
  PORT = "8000"
  DJANGO_SETTINGS_MODULE = "marvel_dc_ultimate_guide.settings"

[deploy]
  release_command = "python manage.py migrate"

[[services]]
  internal_port = 8000
  protocol = "tcp"

  [[services.ports]]
    handlers = ["http"]
    port = 80

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

[processes]
  app = "gunicorn marvel_dc_ultimate_guide.wsgi:application --bind 0.0.0.0:8000"
